# Nano-NLA: Natural Language Autoencoders for Qwen-2.5-0.5B
# ──────────────────────────────────────────────────────────
# Tüm config değerleri buradan okunur. Hiçbir değer hardcode edilmez.
# Orijinal araştırma: https://transformer-circuits.pub/2026/nla/index.html
# Orijinal repo: https://github.com/kitft/natural_language_autoencoders

# ─── Target Model ──────────────────────────────────────────
model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  d_model: 896
  num_layers: 24
  vocab_size: 151936
  # NLA extraction layer: ~2/3 depth (24 * 2/3 ≈ 16)
  target_layer: 16

# ─── NLA Injection Parameters ─────────────────────────────
# injection_scale: hesaplanacak — extract_activations.py çalışınca
# layer-16 aktivasyonlarının ortalama L2-norm'u ölçülüp buraya yazılır.
# Qwen-7B için 150, Qwen-0.5B için ~50-80 bekleniyor.
injection:
  injection_char: "㈎"        # U+320E — Qwen tokenizer'da tek token
  # Aşağıdaki ID'ler ilk çalışmada otomatik hesaplanıp güncellenir
  injection_token_id: null     # auto-computed
  injection_left_neighbor_id: null
  injection_right_neighbor_id: null
  injection_scale: null        # auto-computed from activation norm distribution
  mse_scale: "sqrt_d_model"   # √896 ≈ 29.93 — d-agnostik MSE

# ─── Prompt Templates (orijinal araştırmadan) ─────────────
# AV (Activation Verbalizer) prompt — vektör {injection_char} pozisyonuna enjekte edilir
prompts:
  av: |
    You are a meticulous AI researcher conducting an important investigation into activation vectors from a language model. Your overall task is to describe the semantic content of that activation vector.

    We will pass the vector enclosed in <concept> tags into your context. You must then produce an explanation for the vector, enclosed within <explanation> tags. The explanation consists of 2-3 text snippets describing that vector.

    Here is the vector:

    <concept>{injection_char}</concept>

    Please provide an explanation.

  # AR (Activation Reconstructor) prompt — açıklama metni {explanation} yerine konur
  ar: "Summary of the following text: <text>{explanation}</text> <summary>"

  # Stage-2 teacher summary prompt, adapted from the NLA reference API prompt.
  summary_system: |
    You generate warm-start labels for a Natural Language Autoencoder. A causal language model has processed a text prefix, and an activation was extracted at the final token position. Identify the 2-3 most important features the model would use to predict the next tokens.

    Rules:
    - Use only information available in the prefix.
    - Do not say the text is truncated, incomplete, or a prefix.
    - Order features by importance for next-token prediction.
    - Each feature should be a concise 10-20 word description with concrete examples when useful.
    - The final feature must describe the very end of the sequence: the final token or phrase, its role, and immediate constraints on what follows.
    - Return only one <analysis>...</analysis> block. No markdown, bullets, numbering, code fences, or text outside the tags.


  summary_user: |
    Text to analyze:

    <begin_text>{text}<end_text>

    Return exactly:
    <analysis>
    [first feature]

    [second feature]

    [optional third feature about the final token or phrase and immediate continuation]
    </analysis>
# ─── Data Generation ──────────────────────────────────────
datagen:
  corpus:
    name: HuggingFaceFW/fineweb
    config: sample-10BT
    split: train
    text_column: text
    start: 0
    length: 100000             # Colab GPU run target

  extraction:
    positions_per_doc: 10
    max_length: 2048
    min_position: 50           # Minimum left-context tokens for meaningful activations
    batch_size: 32             # Per-GPU position microbatch
    seed: 42
    # Stage-0 extraction workers. auto expands to all visible CUDA devices.
    worker_devices:
      - auto
    dtype: auto
    shard_flush_rows: 1000
    shard_flush_docs: 200
    resume: true

  # Train/val split oranları
  split:
    av_sft_frac: 0.25          # 25% — AV SFT
    ar_sft_frac: 0.25          # 25% — AR SFT
    rl_frac: 0.50              # 50% — RL
    seed: 42

  # Warm-start explanation provider.
  summary_model:
    provider: deepseek
    local:
      model: Qwen/Qwen2.5-7B-Instruct
      device: auto
      dtype: auto
      batch_size: 8
      chunk_size: 128
      max_new_tokens: 300
      max_input_chars: 2000
      temperature: 0.3
      top_p: 0.9
    groq:
      model: qwen/qwen3-32b
      max_tokens: 300
      temperature: 0.2
      requests_per_minute: 30
      max_concurrency: 8
      max_retries: 5
      retry_base_delay: 2.0
      retry_max_delay: 60.0
      batch_size: 8
      chunk_size: 512
      max_input_chars: 2000
    deepseek:
      model: deepseek-v4-flash
      base_url: https://api.deepseek.com
      max_tokens: 300
      temperature: 0.2
      thinking: disabled
      requests_per_minute: 0
      max_concurrency: 64
      max_retries: 5
      retry_base_delay: 2.0
      retry_max_delay: 60.0
      batch_size: 64
      chunk_size: 512
      max_input_chars: 2000
      timeout_seconds: 120
    nvidia:
      model: nvidia/nemotron-3-nano-30b-a3b
      base_url: https://integrate.api.nvidia.com/v1
      max_tokens: 300
      temperature: 0.2
      requests_per_minute: 40
      max_concurrency: 4
      max_retries: 5
      retry_base_delay: 2.0
      retry_max_delay: 60.0
      batch_size: 4
      chunk_size: 512
      max_input_chars: 2000
      timeout_seconds: 120
    multi:
      providers:
        - deepseek
        - groq
        - nvidia
      weights:
        deepseek: 64
        groq: 8
        nvidia: 4
      skip_unavailable: true
      batch_size: 76
      chunk_size: 512
      max_input_chars: 2000

  output_dir: data/generated

# ─── SFT Training ─────────────────────────────────────────
training:
  sft:
    # Ortak
    device: auto
    dtype: auto
    learning_rate: 2.0e-5
    weight_decay: 0.01
    warmup_ratio: 0.05
    lr_scheduler: cosine
    max_grad_norm: 1.0
    seed: 42

    # AV SFT
    av:
      batch_size: 32
      gradient_accumulation_steps: 1
      num_epochs: 1
      max_response_length: 200         # Token
      save_steps: 500
      logging_steps: 10
      output_dir: checkpoints/av_sft

    # AR SFT
    ar:
      batch_size: 32
      gradient_accumulation_steps: 1
      num_epochs: 1
      save_steps: 500
      logging_steps: 10
      output_dir: checkpoints/ar_sft

  # ─── RL Training (GRPO) ────────────────────────────────
  rl:
    device: auto
    dtype: auto
    actor_lr: 1.0e-5
    critic_lr: 5.0e-5
    grpo_group_size: 8
    rollout_max_length: 200
    kl_coeff: 0.05               # β — KL penalty
    num_steps: 1000              # Toplam RL step
    batch_size: 8
    gradient_accumulation_steps: 1
    save_interval: 100
    logging_steps: 5
    reward_log_transform: true   # r = -log(MSE) — orijinal ile aynı
    output_dir: checkpoints/rl

# ─── Inference ────────────────────────────────────────────
inference:
  temperature: 1.0
  max_new_tokens: 200
  device: auto
  dtype: auto

# ─── Evaluation ───────────────────────────────────────────
eval:
  num_samples: 100               # Değerlendirme sample sayısı
  output_dir: results/eval

# ─── Paths ────────────────────────────────────────────────
paths:
  data_dir: data
  checkpoint_dir: checkpoints
  results_dir: results
