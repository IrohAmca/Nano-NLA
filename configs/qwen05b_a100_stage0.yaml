# Colab A100 Stage-0 profile.
#
# This inherits the main Qwen-0.5B config and only changes extraction settings.
# It writes Stage-0 outputs to Colab's local /content disk for speed. After the
# run finishes, copy /content/nano-nla-stage0/generated back to Drive
# data/generated, then run stages 1-3 with configs/qwen05b.yaml.

extends: qwen05b.yaml

datagen:
  output_dir: /content/nano-nla-stage0/generated
  extraction:
    batch_size: 64
    worker_devices:
      - cuda:0
    shard_flush_rows: 20000
    shard_flush_docs: 2000
    resume: false
